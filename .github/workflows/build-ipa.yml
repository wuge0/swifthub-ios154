name: Build unsigned IPA

# 在 GitHub 的 macOS runner 上编译 SwiftHub（iOS 15.4 目标），产出未签名 IPA 供 TrollStore 安装。
# 用法：把本文件放到仓库的 .github/workflows/ 下，push 后到 Actions 页面下载 artifact。

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  APP_NAME: SwiftHub
  BUNDLE_ID: com.public.SwiftHub   # 与工程 CFBundleIdentifier 保持一致

jobs:
  build:
    runs-on: macos-15                # Xcode 16.x：Kingfisher 8 需要 @retroactive（Swift 6 编译器）

    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          echo "可用："; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "选用：$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          pod --version || echo "CocoaPods 缺失"

      - name: 安装依赖
        run: |
          gem install cocoapods --no-document --quiet || true
          pod install --repo-update

      - name: 编译（关闭签名）
        run: |
          xcodebuild \
            -workspace "${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            STRING_CATALOG_GENERATE_SYMBOLS=YES \
            build

      - name: 检查嵌入的扩展
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/${APP_NAME}.app"
          test -d "$APP" || { echo "构建产物缺失"; exit 1; }
          echo "--- PlugIns ---"
          ls -la "$APP/PlugIns" 2>/dev/null || echo "没有 PlugIns 目录"
          WIDGET="$APP/PlugIns/${APP_NAME}Widget.appex"
          if [ -d "$WIDGET" ]; then
            echo "widget 已嵌入: $(du -sh "$WIDGET" | cut -f1)"
            plutil -p "$WIDGET/Info.plist" | grep -E "CFBundleIdentifier|CFBundleVersion|NSExtensionPointIdentifier"
            vtool -show-build "$WIDGET/${APP_NAME}Widget" | grep -E "minos|sdk"
          else
            echo "!! widget 未嵌入，构建配置有问题"; exit 1
          fi

      - name: 签名 App 与 Widget（ad-hoc）
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/${APP_NAME}.app"

          cat > ent.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key><string>${BUNDLE_ID}</string>
              <key>com.apple.developer.team-identifier</key><string>${BUNDLE_ID}</string>
              <key>keychain-access-groups</key><array><string>${BUNDLE_ID}</string></array>
          </dict>
          </plist>
          PLIST

          WIDGET="$APP/PlugIns/${APP_NAME}Widget.appex"
          if [ -d "$WIDGET" ]; then
            cat > ent-widget.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key><string>${BUNDLE_ID}.widget</string>
          </dict>
          </plist>
          PLIST
            # 扩展先签，再签主程序，避免封条被后写的内容破坏
            codesign -f -s - --entitlements ent-widget.plist "$WIDGET"
            echo "--- widget 签名 ---"
            codesign -dvv "$WIDGET" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier" || true
          fi

          # ldid 2.1.5 对这类 arm64 iOS 二进制会 assert 失败，改用 codesign 做 ad-hoc 签名
          codesign -f -s - --entitlements ent.plist "$APP/${APP_NAME}"
          echo "--- 校验签名中的 entitlements ---"
          codesign -d --entitlements :- "$APP/${APP_NAME}" 2>/dev/null | head -20

      - name: 打包 IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/${APP_NAME}.app"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry "${APP_NAME}-widget-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-widget-unsigned.ipa"
          echo "--- Payload 内容 ---"
          find Payload -maxdepth 2 -name "*.appex"

      - name: 检查最低系统版本
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/${APP_NAME}.app"
          vtool -show-build "$APP/${APP_NAME}" | grep -E "minos|sdk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: error
